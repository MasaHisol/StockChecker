{% extends "auth_base.html" %}{% block title %}初期設定{% endblock %}
{% block body %}
<form method="post" class="card">
  <h2>はじめに管理者アカウントを作成</h2>
  <p class="small muted" style="margin-top:0">このアカウントでチームのメンバー追加や設定の変更を行います。</p>
  <label class="f">氏名</label><input name="name" required autofocus>
  <label class="f">メールアドレス (ログイン ID・通知先)</label><input name="email" type="email" required>
  <label class="f">パスワード (6 文字以上)</label><input name="password" type="password" required minlength="6" autocomplete="new-password">
  <p><button style="width:100%">作成して始める</button></p>
</form>
{% endblock %}
