{% extends "auth_base.html" %}{% block title %}ログイン{% endblock %}
{% block body %}
<form method="post" class="card">
  <h2>ログイン</h2>
  <label class="f">メールアドレス</label><input name="email" type="email" required autofocus autocomplete="username">
  <label class="f">パスワード</label><input name="password" type="password" required autocomplete="current-password">
  <p><button style="width:100%">ログイン</button></p>
  <div class="hint">アカウントが無い場合は、管理者に「チーム・仕入先」画面での追加を依頼してください。</div>
</form>
{% endblock %}
